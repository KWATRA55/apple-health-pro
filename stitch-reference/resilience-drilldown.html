<style>
        body {
            background-color: #000000;
            color: #e2e2e2;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
        }

        .bg-aura {
            position: fixed;
            top: 20%;
            left: 50%;
            width: 120vw;
            height: 120vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* SVG Ring Animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .glow-filter {
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
        }

        /* Hide scrollbar for clean app feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
@keyframes morph {
  0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: scale(1); }
  33% { border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%; transform: scale(1.05); }
  66% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; transform: scale(0.95); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.5; filter: blur(20px); }
  50% { opacity: 0.8; filter: blur(35px); }
}

.sphere-container {
  width: 192px;
  height: 192px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.organic-orb {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 30% 30%, #C084FC 0%, #A855F7 50%, #7E22CE 100%);
  animation: morph 8s ease-in-out infinite alternate;
  box-shadow: inset -10px -10px 30px rgba(0,0,0,0.3), 0 0 40px rgba(168, 85, 247, 0.4);
  z-index: 1;
}

.orb-glow {
  position: absolute;
  width: 110%;
  height: 110%;
  background: #A855F7;
  border-radius: 50%;
  filter: blur(25px);
  opacity: 0.5;
  animation: pulse-glow 4s ease-in-out infinite;
  z-index: 0;
}
</style></head>
<body class="antialiased min-h-screen relative pb-24 md:pb-0 pt-16">
<!-- Ambient Aura Background -->

<!-- TopAppBar -->

<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary-fixed-dim transition-colors active:scale-95 duration-200" onclick="history.back()">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-on-surface">RESILIENCE</h1>
</div>

</button>
</header>
